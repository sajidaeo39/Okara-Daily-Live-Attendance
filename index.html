<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Teacher & Student Attendance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>:root{--blue:#0b5ed7;--dark:#17345f;--line:#dfe5ee;--muted:#667085;--red:#c62828;--green:#16803c;--content:1180px;--control-h:38px}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#fff;font-family:Segoe UI,Arial,sans-serif;color:#172033}header{background:#fff;color:#17344d;padding:8px 0 9px;box-shadow:0 2px 10px rgba(23,52,77,.055);border-bottom:1px solid #e2eaf2}header .wrap{text-align:center}header h1{margin:0;font-size:23px;font-weight:750;color:#17344d}.dashboard-title{text-align:center;line-height:1.2;display:block;max-width:var(--content);margin:0 auto;padding:8px 16px;border:0;border-radius:10px;background:#f4f8fc;box-shadow:none}header p{margin:4px 0 0;color:#52657a;font-size:11px}.byline{font-weight:600;color:#52657a!important;font-size:11px!important;margin-top:4px!important}.wrap{max-width:var(--content);margin:auto;padding:8px 12px}#app{display:none}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;width:100%;margin:0 0 11px}.card{background:#fff;border:1px solid #dfe7ef;border-radius:10px;padding:8px 7px;box-shadow:0 2px 8px rgba(25,54,79,.055);min-width:0;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.card:hover{box-shadow:0 4px 10px rgba(25,54,79,.08);transform:translateY(-1px)}.card:nth-child(6n+1){background:#f2f7fb}.card:nth-child(6n+1) .num{color:#315b7d}.card:nth-child(6n+2){background:#f2f8f6}.card:nth-child(6n+2) .num{color:#246c5c}.card:nth-child(6n+3){background:#f1f8f4}.card:nth-child(6n+3) .num{color:#24784f}.card:nth-child(6n+4){background:#fff5f2}.card:nth-child(6n+4) .num{color:#a84e40}.card:nth-child(6n+5){background:#fff9ee}.card:nth-child(6n+5) .num{color:#916a1c}.card:nth-child(6n) {background:#f5f3fb}.card:nth-child(6n) .num{color:#66599c}.label{font-size:9.5px;color:#5f7080;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.num{font-size:18px;line-height:1.1;font-weight:750;margin-top:4px;text-align:center}.tabs{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;justify-content:center;margin:0 0 10px;padding:0 1px}.tab{background:#fff;border:1px solid #cbd5e1;border-radius:7px;padding:0 13px;height:var(--control-h);min-width:112px;white-space:nowrap;font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.toolbar{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:nowrap;width:100%;background:#fff;border:1px solid var(--line);padding:9px;border-radius:10px;margin:0 0 10px;box-shadow:0 2px 7px rgba(25,54,79,.04);overflow-x:auto}.toolbar input,.toolbar select,.toolbar .action{height:var(--control-h);box-sizing:border-box}.toolbar input,.toolbar select{padding:0 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font:12px Segoe UI,Arial,sans-serif;color:#172033}.toolbar input{min-width:0;width:min(390px,34vw);flex:1 1 390px}.toolbar select{min-width:112px;width:112px}.toolbar .action{border:0;border-radius:7px;padding:0 12px;background:#0f766e;color:#fff;font:650 12px Segoe UI,Arial,sans-serif;cursor:pointer;white-space:nowrap;min-width:112px}.toolbar .pdf{background:#b42318}.secondary{background:#475467!important}.note{font-size:11px;color:var(--muted);margin:4px 0 7px}.warning{background:#fff4d6;border:1px solid #f2c66d;color:#704c00;padding:9px 11px;border-radius:9px;margin:8px 0;font-size:12px}.tablebox{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%;font-size:10px;table-layout:fixed}th,td{padding:9px 5px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.3;border-bottom:1px solid var(--line);text-align:center!important;vertical-align:middle!important;font-variant-numeric:tabular-nums}th{position:sticky;top:0;background:#edf4fd;z-index:1}th:first-child,td:first-child{text-align:left!important}td:first-child{font-weight:500}.good{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.amber{color:#b26a00;font-weight:700}.progress-high td{background:#edf9f4}.progress-low td{background:#fff0f0}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:1100px){.cards{grid-template-columns:repeat(5,minmax(0,1fr))}.toolbar{justify-content:flex-start}}@media(max-width:700px){.wrap{padding:7px 9px}.dashboard-title{padding:7px 10px;font-size:18px!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{height:66px}.tabs{justify-content:flex-start}.toolbar{justify-content:flex-start}.toolbar input{width:260px;flex:0 0 260px}}</style>
</head>
<body>
<header><div class="wrap">
<h1 class="dashboard-title">Teacher &amp; Student Attendance Dashboard (District Okara)</h1>
<p class="byline">Developed by M.Sajid AEO Amli Moti (W) Depalpur</p>
<div class="note header-info" id="info"></div>
</div></header>

<div class="wrap">
<div id="app">
<div id="cards" class="cards"></div>

<div class="tabs">
<button class="tab active" data-view="school">School Wise</button>
<button class="tab" data-view="markaz">Markaz Wise</button>
<button class="tab" data-view="tehsil">Tehsil Wise</button>
<button class="tab" data-view="wing">Wing Wise</button>
<button class="tab" data-view="zero">Zero Progress Schools</button>
<button class="tab" data-view="zeroTeacher">Zero Teacher Attendance</button>
<button class="tab" data-view="zeroStudent">Zero Students Attendance</button>
</div>

<div class="toolbar">
<input id="search" placeholder="Search school / markaz / tehsil / EMIS">
<select id="tehsilFilter"><option value="">All Tehsils</option></select>
<select id="markazFilter"><option value="">All Markaz</option></select>
<select id="wingFilter"><option value="">All Wings</option></select>
<select id="attendanceType">
<option value="both">Teacher + Student</option><option value="teacher">Teacher Attendance</option><option value="student">Student Attendance</option>
</select>
<button class="action secondary" id="clearBtn">Reset Filters</button>
<button class="action" id="excelBtn">⬇ Download Excel</button>
<button class="action pdf" id="pdfBtn">⬇ Download PDF</button>
</div>

<div id="warning" class="warning" style="display:none"></div>

</div>

<div class="pdf-only" id="pdfHeader"><div id="pdfTitle" style="font-size:15px;font-weight:800;text-align:center;margin-bottom:3px">School Wise Attendance</div><div id="pdfMeta" style="font-size:8px;text-align:center;margin-bottom:7px"></div></div>

<div class="tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</div>
</div>

<script>
let rows=[], currentView='school', reportDate='';
const LIVE_DATA_URL='data.json';

const num=(v)=>{ if(v===null||v===undefined||v==='') return 0; const n=Number(v); return Number.isFinite(n)?n:0; };
const fmt=(n)=>Number(n||0).toLocaleString('en-US');
const pct=(p,t)=>t>0?Math.round(p/t*1000)/10:0;
function formatPKT(value=new Date()){
 const d=new Date(value);
 if(Number.isNaN(d.getTime())) return '—';
 return new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Karachi',month:'short',day:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).format(d);
}
const safe=(s)=>String(s??'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_').replace(/_+/g,'_');
const esc=(s)=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function normalize(r){
 return {
  tehsil:String(r['Tehsil']??'').trim(),
  tehsilID:String(r['Tehsil ID']??'').trim(),
  markaz:String(r['Report Markaz']??r['Markaz']??'').trim(),
  markazID:String(r['Actual Markaz ID']??r['Markaz ID']??'').trim(),
  wing:String(r['Wing']??'').trim(),
  school:String(r['School']??'').trim(),
  schoolID:String(r['School ID']??'').trim(),
  emis:String(r['EMIS']??'').trim(),
  tp:num(r['Teacher Present']), ta:num(r['Teacher Absent']), tu:num(r['Teacher Unmarked']), tt:num(r['Teacher Total']),
  sp:num(r['Student Present']), sa:num(r['Student Absent']), su:num(r['Student Unmarked']), st:num(r['Student Total']),
  sm:num(r['Student Marked'])
 };
}
function teacherRate(r){return r.tt>0?100*r.tp/r.tt:0}
function studentRate(r){return r.st>0?100*r.sp/r.st:0}
function rateFor(r,type){return type==='teacher'?teacherRate(r):studentRate(r)}

function filtered(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const t=document.getElementById('tehsilFilter').value, m=document.getElementById('markazFilter').value, w=document.getElementById('wingFilter').value;
 return rows.filter(r=>
  (!q || [r.school,r.markaz,r.tehsil,r.emis].join(' ').toLowerCase().includes(q)) &&
  (!t||r.tehsil===t)&&(!m||r.markaz===m)&&(!w||r.wing===w)
 );
}
function aggregate(list,field){
 const map=new Map();
 list.forEach(r=>{
  const key=r[field]||'Unknown';
  if(!map.has(key)) map.set(key,{name:key,schools:0,tp:0,ta:0,tu:0,tt:0,sp:0,sa:0,su:0,st:0,sm:0});
  const a=map.get(key); a.schools++;
  ['tp','ta','tu','tt','sp','sa','su','st','sm'].forEach(k=>a[k]+=r[k]);
 });
 return [...map.values()];
}
function renderCards(){
 const f=filtered();
 const s=f.reduce((a,r)=>{['tp','ta','tu','tt','sp','sa','su','st','sm'].forEach(k=>a[k]+=r[k]);a.schools++;return a},{schools:0,tp:0,ta:0,tu:0,tt:0,sp:0,sa:0,su:0,st:0,sm:0});
 const markedTeachers=s.tt, markedStudents=s.st;
 const tr=pct(s.tp,markedTeachers), sr=pct(s.sp,markedStudents);
 document.getElementById('cards').innerHTML=[
 ['Total Teachers',s.tt,'Present + Absent + Unmarked'],
 ['Teachers Present',s.tp,'Present teachers'],
 ['Teachers Absent',s.ta,'Absent teachers'],
 ['Teachers Unmarked',s.tu,'Excluded from teacher %'],
 ['Teacher %',tr+'%','Present Teachers / Total Teachers'],
 ['Total Students',s.st,'Present + Absent + Unmarked'],
 ['Students Present',s.sp,'Present students'],
 ['Students Absent',s.sa,'Absent students'],
 ['Students Unmarked',s.su,'Excluded from student %'],
 ['Student %',sr+'%','Present Students / Total Students']
 ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num">${typeof x[1]==='number'?fmt(x[1]):x[1]}</div></div>`).join('');
}

function sortForPerformance(list){
  const type=document.getElementById('attendanceType').value;
  return [...list].sort((a,b)=>{
    const rb=rateFor(b,type), ra=rateFor(a,type);
    if(rb!==ra) return rb-ra;
    return String(a.school||a.name||'').localeCompare(String(b.school||b.name||''));
  });
}
function sortAggregatesForPerformance(list){
  const type=document.getElementById('attendanceType').value;
  return [...list].sort((a,b)=>{
    const rb=rateFor(b,type), ra=rateFor(a,type);
    if(rb!==ra) return rb-ra;
    return String(a.name||'').localeCompare(String(b.name||''));
  });
}

function tableFor(f){
 if(currentView==='school') return {
  title:'School Wise Attendance',
  headers:['School','Tehsil','Markaz','Wing','Total Teachers','Teachers Present','Teachers Absent','Teachers Unmarked','Teachers %','Total Students','Students Present','Students Absent','Students Unmarked','Students %'],
  data:sortForPerformance(f).map(r=>[r.school,r.tehsil,r.markaz,r.wing,r.tt,r.tp,r.ta,r.tu,teacherRate(r).toFixed(1)+'%',r.st,r.sp,r.sa,r.su,studentRate(r).toFixed(1)+'%'])
 };
 if(currentView==='markaz'||currentView==='tehsil'||currentView==='wing'){
  const field=currentView==='markaz'?'markaz':currentView;
  return {title:currentView[0].toUpperCase()+currentView.slice(1)+' Wise Attendance',
   headers:[field[0].toUpperCase()+field.slice(1),'Schools','Total Teachers','Teachers Present','Teachers Absent','Teachers Unmarked','Teachers %','Total Students','Students Present','Students Absent','Students Unmarked','Students %'],
   data:sortAggregatesForPerformance(aggregate(f,field)).map(a=>[a.name,a.schools,a.tt,a.tp,a.ta,a.tu,pct(a.tp,a.tt).toFixed(1)+'%',a.st,a.sp,a.sa,a.su,pct(a.sp,a.st).toFixed(1)+'%'])
  };
 }
 if(currentView==='zero' || currentView==='zeroTeacher' || currentView==='zeroStudent'){
  let a=f;
  let title='Zero Progress Schools';
  if(currentView==='zeroTeacher'){
   a=f.filter(r=>r.tt>0 && r.tp===0);
   title='Zero Teacher Attendance';
  } else if(currentView==='zeroStudent'){
   a=f.filter(r=>r.st>0 && r.sp===0);
   title='Zero Students Attendance';
  } else {
   a=f.filter(r=>(r.tt>0 || r.st>0) && r.tp===0 && r.sp===0);
  }
  return {title,
   headers:['School','Tehsil','Markaz','Wing','Total Teachers','Teachers Present','Teachers Absent','Teachers Unmarked','Teachers %','Total Students','Students Present','Students Absent','Students Unmarked','Students %'],
   data:a.sort((x,y)=>String(x.school).localeCompare(String(y.school))).map(r=>[r.school,r.tehsil,r.markaz,r.wing,r.tt,r.tp,r.ta,r.tu,teacherRate(r).toFixed(1)+'%',r.st,r.sp,r.sa,r.su,studentRate(r).toFixed(1)+'%'])};
 }
 return {title:'School Wise Attendance',
  headers:['School','Tehsil','Markaz','Wing','Total Teachers','Teachers Present','Teachers Absent','Teachers Unmarked','Teachers %','Total Students','Students Present','Students Absent','Students Unmarked','Students %'],
  data:sortForPerformance(f).map(r=>[r.school,r.tehsil,r.markaz,r.wing,r.tt,r.tp,r.ta,r.tu,teacherRate(r).toFixed(1)+'%',r.st,r.sp,r.sa,r.su,studentRate(r).toFixed(1)+'%'])};
}
function renderTable(){
 const f=filtered(), td=tableFor(f);
 document.getElementById('thead').innerHTML='<tr>'+td.headers.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>';
 document.getElementById('tbody').innerHTML=td.data.length?td.data.map(r=>{
   const rates=r.map((v,i)=>({h:td.headers[i]||'',n:parseFloat(v)})).filter(x=>x.h.includes('%')&&Number.isFinite(x.n));
   const minRate=rates.length?Math.min(...rates.map(x=>x.n)):100;
   const rowClass=minRate>=90?'progress-high':minRate<70?'progress-low':'';
   return '<tr class="'+rowClass+'">'+r.map((v,i)=>{
    let cls='', hh=td.headers[i]||'';
    if(hh.includes('%')){let n=parseFloat(v);cls=n>=90?'good':n<70?'bad':'amber'}
    return `<td class="${cls}">${typeof v==='number'?fmt(v):esc(v)}</td>`;
   }).join('')+'</tr>';
 }).join(''):`<tr><td colspan="${td.headers.length}" class="empty">No records found.</td></tr>`;
 document.getElementById('info').textContent=`${td.title} • ${td.data.length.toLocaleString()} rows • ${reportDate?'Data updated: '+reportDate+' PKT':''}`;
}

function renderDashboard(){
 renderCards();renderTable();
 const f=filtered();
 const counts={
  zero:f.filter(r=>(r.tt>0||r.st>0)&&r.tp===0&&r.sp===0).length,
  zeroTeacher:f.filter(r=>r.tt>0&&r.tp===0).length,
  zeroStudent:f.filter(r=>r.st>0&&r.sp===0).length
 };
 [['zero','Zero Progress Schools'],['zeroTeacher','Zero Teacher Attendance'],['zeroStudent','Zero Students Attendance']].forEach(([view,label])=>{
  const el=document.querySelector('.tab[data-view="'+view+'"]');
  if(el) el.textContent=label+(counts[view]?' ('+counts[view]+')':'');
 });
}

function fillFilters(){
 const fill=(id,vals,label)=>{const el=document.getElementById(id);const old=el.value;el.innerHTML=`<option value="">${label}</option>`+[...new Set(vals.filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if([...el.options].some(o=>o.value===old))el.value=old;};
 fill('tehsilFilter',rows.map(r=>r.tehsil),'All Tehsils');
 fill('markazFilter',rows.map(r=>r.markaz),'All Markaz');
 fill('wingFilter',rows.map(r=>r.wing),'All Wings');
}


let loadingLiveData=false;
async function loadLiveData(){
  if(loadingLiveData) return;
  loadingLiveData=true;
  try{
    const res=await fetch(LIVE_DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const payload=await res.json();
    if(!Array.isArray(payload.rows)) throw new Error('data.json has no rows array');
    rows=payload.rows.map(normalize).filter(r=>r.school||r.emis);
    reportDate=payload.generated_at?formatPKT(payload.generated_at):'';
    document.getElementById('app').style.display='block';
    const v=payload.validation||{};
    const warn=document.getElementById('warning');
    if(v.status==='PENDING'){
      warn.style.display='block';
      warn.innerHTML=`ℹ️ <b>LIVE SIS DATA NOT UPDATED YET</b> — the daily SIS collection has not produced a new dataset yet.`;
    }else if(v.status==='INCOMPLETE'){
      warn.style.display='block';
      warn.innerHTML=`⚠️ <b>LIVE SIS DATA INCOMPLETE</b> — Expected: ${fmt(v.expected_schools||0)} schools • Collected: ${fmt(v.collected_schools||rows.length)} • Missing: ${fmt(v.missing_schools||0)} • Errors: ${fmt(v.error_count||0)}. Data is shown without filling failed schools with fake zero values.`;
    }else{
      warn.style.display='none';
    }
    fillFilters();renderDashboard();
  }catch(err){
    console.error('Live data unavailable:', err);
  }
}
window.addEventListener('load',loadLiveData);
setInterval(loadLiveData,30*1000);

['search','tehsilFilter','markazFilter','wingFilter','attendanceType'].forEach(id=>document.getElementById(id).addEventListener('input',renderDashboard));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;renderTable();}));

document.getElementById('clearBtn').onclick=()=>{document.getElementById('search').value='';['tehsilFilter','markazFilter','wingFilter'].forEach(id=>document.getElementById(id).value='');document.getElementById('attendanceType').value='both';renderDashboard();};

function downloadRows(){
 const td=tableFor(filtered()), total=pdfTotals(td);
 const aoa=[td.headers,...td.data,total], ws=XLSX.utils.aoa_to_sheet(aoa);
 ws['!cols']=td.headers.map(()=>({wch:8}));
 ws['!rows']=aoa.map((_,i)=>({hpt:i===0?36:45}));
 for(let r=0;r<aoa.length;r++) for(let c=0;c<td.headers.length;c++){
   const a=XLSX.utils.encode_cell({r,c}); if(!ws[a]) continue;
   ws[a].s={alignment:{horizontal:'center',vertical:'center',wrapText:true},font:{name:'Arial',sz:9,bold:r===0||r===aoa.length-1}};
   if(r===0)ws[a].s.fill={fgColor:{rgb:'EAF2FB'}};
   if(r===aoa.length-1)ws[a].s.fill={fgColor:{rgb:'DDE8F5'}};
 }
 ws['!freeze']={xSplit:0,ySplit:1};
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'Attendance Report');
 XLSX.writeFile(wb,`Attendance_${safe(td.title)}_${reportDate||new Date().toISOString().slice(0,10)}.xlsx`);
}

function pdfTotals(td){
 const h=td.headers, rows=td.data, ix=n=>h.indexOf(n), sum=n=>{const i=ix(n);return i<0?0:rows.reduce((s,r)=>s+num(r[i]),0)};
 const row=new Array(h.length).fill(''); row[0]='GRAND TOTAL';
 const put=(n,v)=>{const i=ix(n);if(i>=0)row[i]=v};
 const tt=sum('Total Teachers'),tp=sum('Teachers Present');
 put('Total Teachers',tt);put('Teachers Present',tp);put('Teachers Absent',sum('Teachers Absent'));put('Teachers Unmarked',sum('Teachers Unmarked'));
 if(ix('Teachers %')>=0)put('Teachers %',(tt?100*tp/tt:0).toFixed(1)+'%');
 const st=sum('Total Students'),sp=sum('Students Present');
 put('Total Students',st);put('Students Present',sp);put('Students Absent',sum('Students Absent'));put('Students Unmarked',sum('Students Unmarked'));
 if(ix('Students %')>=0)put('Students %',(st?100*sp/st:0).toFixed(1)+'%');
 return row;
}

document.getElementById('excelBtn').onclick=downloadRows;

document.getElementById('pdfBtn').onclick=()=>{
  try{
    if(!window.jspdf||!window.jspdf.jsPDF) throw new Error('PDF library is not loaded');
    const {jsPDF}=window.jspdf;
    const list=filtered(), td=tableFor(list);
    const total=pdfTotals(td);
    const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
    const W=842,H=595,M=28,C=W-2*M;
    const navy=[25,50,88], light=[244,247,250], line=[185,195,208], green=[31,130,86], red=[190,48,48], amber=[226,177,35], textc=[45,55,68], muted=[92,105,122];
    const fmt=v=>Number(v||0).toLocaleString('en-US');
    const unique=a=>[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))];
    const tehsils=unique(list.map(r=>r.tehsil)), wings=unique(list.map(r=>r.wing)), markazs=unique(list.map(r=>r.markaz));
    const parts=['District Okara'];
    if(wings.length===1) parts.push('Wing: '+wings[0]);
    if(tehsils.length===1) parts.push('Tehsil: '+tehsils[0]);
    if(markazs.length===1 && (currentView==='markaz'||currentView==='school'||currentView.startsWith('zero'))) parts.push('Markaz: '+markazs[0]);
    const viewLabel={school:'School-wise Attendance',markaz:'Markaz-wise Attendance',tehsil:'Tehsil-wise Attendance',wing:'Wing-wise Attendance',zero:'Zero Progress Schools',zeroTeacher:'Zero Teacher Attendance',zeroStudent:'Zero Students Attendance'};
    parts.push(viewLabel[currentView]||td.title);
    const contextTitle=parts.join(' | ');

    const sum=list.reduce((a,r)=>{['tp','ta','tu','tt','sp','sa','su','st','sm'].forEach(k=>a[k]+=r[k]);a.schools++;return a},{schools:0,tp:0,ta:0,tu:0,tt:0,sp:0,sa:0,su:0,st:0,sm:0});
    const teacherPct=sum.tt?100*sum.tp/sum.tt:0, studentPct=sum.st?100*sum.sp/sum.st:0;

    const drawTop=()=>{
      doc.setFillColor(255,255,255);doc.rect(0,0,W,H,'F');
      doc.setFillColor(...navy);doc.rect(0,0,W,6,'F');
      doc.setFont('helvetica','bold');doc.setTextColor(...navy);doc.setFontSize(18);
      doc.text('Latest SIS Attendance',W/2,36,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...muted);
      doc.text('Report Date / Time: '+(reportDate||'—')+'  •  Generated: '+formatPKT(new Date()),W/2,53,{align:'center'});
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...navy);
      doc.text(contextTitle,M,70,{align:'left',maxWidth:C-190});
      doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...green);
      doc.text('Green = 90% or above',W-M-105,70,{align:'right'});
      doc.setTextColor(...red);doc.text('Red = below 70%',W-M,70,{align:'right'});
    };

    const cards=[
      ['Schools',sum.schools],['Total Teachers',sum.tt],['Teachers Present',sum.tp],['Teachers Absent',sum.ta],['Teachers Unmarked',sum.tu],
      ['Teacher %',teacherPct.toFixed(1)+'%'],['Total Students',sum.st],['Students Present',sum.sp],['Students Absent',sum.sa],['Students Unmarked',sum.su]
    ];
    const drawCards=()=>{
      const gap=9,cols=5,cw=(C-gap*4)/5,ch=50,y0=88;
      cards.forEach((q,i)=>{
        const row=Math.floor(i/cols),col=i%cols,x=M+col*(cw+gap),y=y0+row*(ch+gap);
        doc.setFillColor(...light);doc.setDrawColor(...line);doc.setLineWidth(.8);doc.roundedRect(x,y,cw,ch,4,4,'FD');
        doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...muted);doc.text(q[0],x+cw/2,y+16,{align:'center',maxWidth:cw-8});
        doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...navy);doc.text(typeof q[1]==='number'?fmt(q[1]):q[1],x+cw/2,y+37,{align:'center'});
      });
    };

    const headers=td.headers;
    const body=[...td.data,total];
    const widths=headers.map(h=>{
      if(h==='School'||h==='Markaz'||h==='Tehsil'||h==='Wing') return h==='School'?120:58;
      if(h==='Schools') return 38;
      if(h.includes('%')) return 43;
      if(h.includes('Unmarked')) return 48;
      if(h.includes('Present')||h.includes('Absent')) return 48;
      if(h.includes('Total')) return 48;
      return 42;
    });
    const scale=C/widths.reduce((a,b)=>a+b,0);
    const footer=page=>{
      doc.setDrawColor(...line);doc.setLineWidth(.7);doc.line(M,H-25,W-M,H-25);
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...muted);
      doc.text('Dashboard developed by M.Sajid AEO Markaz Amli Moti (W)',W/2,H-12,{align:'center'});
      doc.text('Page '+page,M,H-12);
    };
    const drawTableHeader=(y)=>{
      y+=4;doc.setFillColor(...navy);doc.setDrawColor(...navy);doc.setLineWidth(.8);doc.rect(M,y,C,27,'FD');
      doc.setFont('helvetica','bold');doc.setFontSize(6.2);doc.setTextColor(255,255,255);
      let x=M;
      headers.forEach((h,i)=>{
        const label=String(h).replace('Total Teachers','Total\\nTeachers').replace('Teachers Present','Teachers\\nPresent').replace('Teachers Absent','Teachers\\nAbsent').replace('Teachers Unmarked','Teachers\\nUnmarked').replace('Total Students','Total\\nStudents').replace('Students Present','Students\\nPresent').replace('Students Absent','Students\\nAbsent').replace('Students Unmarked','Students\\nUnmarked').replace('Teachers %','Teachers\\n%').replace('Students %','Students\\n%');
        const lines=label.split('\\n');
        doc.text(lines,x+(widths[i]*scale)/2,y+(lines.length>1?10:17),{align:'center',maxWidth:widths[i]*scale-5,lineHeightFactor:1});
        doc.setDrawColor(255,255,255);doc.rect(x,y,widths[i]*scale,27,'S');x+=widths[i]*scale;
      });
      return y+27;
    };

    let page=1;drawTop();drawCards();let y=drawTableHeader(202);
    const drawRow=(row,ri)=>{
      const isTotal=ri===body.length-1;
      const nameIndex=0;
      const nameLines=doc.splitTextToSize(String(row[nameIndex]??''),Math.max(45,widths[nameIndex]*scale-8));
      const rowH=Math.max(20,Math.min(34,8+nameLines.length*8));
      if(y+rowH>H-48){footer(page);doc.addPage();page++;drawTop();y=drawTableHeader(96);}
      doc.setFillColor(...(isTotal?[232,238,245]:ri%2?[255,255,255]:[247,249,252]));
      doc.setDrawColor(...line);doc.setLineWidth(.6);doc.rect(M,y,C,rowH,'FD');
      let x=M;
      row.forEach((v,i)=>{
        const h=headers[i]||'',n=parseFloat(String(v)),isName=i===0;
        doc.setFont('helvetica',isTotal||h.includes('%')?'bold':'normal');doc.setFontSize(6.8);
        if(h.includes('%')&&Number.isFinite(n)) doc.setTextColor(...(n>=90?green:n<70?red:amber)); else doc.setTextColor(...navy);
        const txt=typeof v==='number'?fmt(v):String(v??'');
        const lines=isName?doc.splitTextToSize(txt,Math.max(45,widths[i]*scale-8)):txt;
        const tx=isName?x+5:x+(widths[i]*scale)/2,ty=Array.isArray(lines)&&lines.length>1?y+10:y+rowH/2+2.5;
        doc.text(lines,tx,ty,{align:isName?'left':'center',maxWidth:widths[i]*scale-7,lineHeightFactor:1.05});
        doc.setDrawColor(...line);doc.rect(x,y,widths[i]*scale,rowH,'S');x+=widths[i]*scale;
      });
      y+=rowH;
    };
    body.forEach(drawRow);
    footer(page);

    const fileSafe2=s=>String(s||'All').replace(/[\\/:*?"<>|]+/g,'-').replace(/\\s+/g,'_').replace(/_+/g,'_');
    const stampNow2=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`};
    const reportLabel2=()=>({school:'School_Wise',markaz:'Markaz_Wise',tehsil:'Tehsil_Wise',wing:'Wing_Wise',zero:'Zero_Progress_Schools',zeroTeacher:'Zero_Teacher_Attendance',zeroStudent:'Zero_Students_Attendance'}[currentView]||'Report');
    const reportSuffix2=()=>{
      const t=document.getElementById('tehsilFilter').value,w=document.getElementById('wingFilter').value,q=document.getElementById('search').value.trim(),m=document.getElementById('markazFilter').value;
      const p=[];if(t)p.push('Tehsil-'+fileSafe2(t));if(w)p.push('Wing-'+fileSafe2(w));if(m)p.push('Markaz-'+fileSafe2(m));if(q)p.push('Search-'+fileSafe2(q));
      return `${reportLabel2()}${p.length?'_'+p.join('_'):'_All_Filters'}_${stampNow2()}`;
    };
    doc.save(reportSuffix2()+'.pdf');
  }catch(err){console.error('PDF export error:',err);alert('PDF generation failed. Please try again.');}
};
</script>
</body>
</html>

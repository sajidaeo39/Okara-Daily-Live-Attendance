name: Update Okara Attendance V28

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write

concurrency:
  group: okara-attendance-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests openpyxl

      - name: Collect SIS attendance V28
        run: |
          python --version
          python attendance_collector.py --github-data data.json

      - name: Validate live data
        run: |
          python - <<'PY'
          import json, sys
          with open('data.json', encoding='utf-8') as f:
              p = json.load(f)
          v = p.get('validation', {})
          print('STATUS:', v.get('status'))
          print('EXPECTED:', v.get('expected_schools'))
          print('COLLECTED:', v.get('collected_schools'))
          print('MISSING:', v.get('missing_schools'))
          print('ERRORS:', v.get('error_count'))
          if v.get('status') != 'COMPLETE':
              print('WARNING: SIS collection is incomplete. data.json is still published so missing schools/errors are visible on the dashboard.')
          PY

      - name: Commit live data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'Update Okara live attendance V28'
            git push
          fi
